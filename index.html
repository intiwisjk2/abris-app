<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Абрис" />
    <link rel="apple-touch-icon" href="./icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script>!function(){try{var t=localStorage.getItem('pref:theme');if(t==='dark')document.documentElement.classList.add('theme-dark');else if(t==='light')document.documentElement.classList.add('theme-light');}catch(e){}}();</script>
    <title>Абрис</title>
  </head>
  <body>
    <div id="sticky-header" class="sticky-header" hidden>
      <div class="sticky-progress"><div id="sticky-progress-bar"></div></div>
    </div>

    <main id="app"></main>

    <template id="tpl-auth">
      <section class="auth">
        <div class="auth-card">
          <div class="auth-logo" aria-hidden="true">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
              <style>
                .al-bg { fill: #f2e0ce; }
                .al-s  { stroke: #a83318; }
                @media (prefers-color-scheme: dark) {
                  .al-bg { fill: #1a1a1f; }
                  .al-s  { stroke: #e87a4f; }
                }
              </style>
              <rect class="al-bg" width="100" height="100"/>
              <g class="al-s" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <line x1="50" y1="17" x2="13" y2="83"/>
                <line x1="50" y1="17" x2="87" y2="83"/>
                <line x1="28" y1="56" x2="72" y2="56"/>
              </g>
            </svg>
          </div>
          <h1 class="auth-title">Авторизация устройства</h1>

          <!-- Шаг 1: код устройства -->
          <div class="auth-step js-step-1">
            <label class="auth-label">Код устройства</label>
            <div class="auth-row">
              <code class="auth-code js-auth-code"></code>
              <button class="auth-action js-auth-copy" type="button">
                <svg class="copy-default" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                <svg class="copy-done" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
                <span class="copy-default-text">Копировать</span>
                <span class="copy-done-text">Скопировано</span>
              </button>
            </div>
            <button class="auth-next js-auth-next" type="button">
              <span>У меня есть пароль</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
          </div>

          <!-- Шаг 2: вставка пароля -->
          <div class="auth-step js-step-2" hidden>
            <p class="auth-paste-hint js-paste-hint">Скопируйте пароль в буфер обмена и нажмите кнопку ниже</p>
            <p class="auth-paste-error js-auth-error" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <span class="js-auth-error-text">Неверный пароль</span>
            </p>
            <button class="auth-submit js-auth-paste-submit" type="button">
              <span class="auth-submit-text">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                </svg>
                Вставить пароль
              </span>
              <span class="auth-submit-spinner" aria-hidden="true"></span>
            </button>
            <button class="auth-back js-auth-back" type="button">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
              Назад
            </button>
          </div>
        </div>
      </section>
    </template>

    <template id="tpl-list">
      <header class="page-header">
        <div class="brand-row">
          <h1 class="brand">Абрис</h1>
          <div class="brand-controls">
            <button class="update-chip js-update-chip" type="button" aria-label="Обновить ленту">
              <svg class="update-chip-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 2v6h-6"/>
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                <path d="M3 22v-6h6"/>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
              </svg>
              <span class="update-chip-text">Только что</span>
            </button>
            <button class="icon-btn js-settings" aria-label="Настройки">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
          </div>
        </div>
        <p class="brand-sub">Автоматический дайджест из открытых СМИ · не редакционный материал</p>
        <nav class="filters" role="tablist" aria-label="Фильтр категорий">
          <button class="filter is-active" data-filter="all" role="tab">Все</button>
          <button class="filter" data-filter="front" role="tab">СВО</button>
          <button class="filter" data-filter="russia" role="tab">Россия</button>
          <button class="filter" data-filter="world" role="tab">Мир</button>
        </nav>
      </header>
      <ul class="cards" id="cards"></ul>
    </template>

    <template id="tpl-card">
      <li class="card">
        <a class="card-link" href="#">
          <div class="card-top">
            <div class="card-top-left">
              <span class="badge"></span>
              <span class="new-badge js-new-badge" hidden aria-label="Новая статья">Новое</span>
            </div>
            <span class="card-time"></span>
          </div>
          <h2 class="card-title"></h2>
          <p class="card-summary"></p>
          <ul class="card-highlights"></ul>
          <div class="card-bottom">
            <span class="card-period"></span>
            <span class="card-read"></span>
          </div>
        </a>
      </li>
    </template>

    <template id="tpl-article">
      <div class="article-toolbar article-toolbar--top">
        <a class="pill-btn js-back" href="#/"><span class="arrow">←</span><span>Назад</span></a>
        <button class="pill-btn js-settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Настройки</span>
        </button>
        <button class="pill-btn js-anchor is-disabled" data-direction="down"><span>К закладке</span><span class="arrow">↓</span></button>
      </div>
      <header class="article-header">
        <h1 class="article-title"></h1>
        <div class="article-meta">
          <span class="badge article-badge"></span>
          <span class="article-period"></span>
          <span class="dot">·</span>
          <span class="article-time"></span>
        </div>
      </header>
      <article class="article-body" id="article-body"></article>
      <footer class="article-footer">
        <div class="article-toolbar article-toolbar--bottom">
          <a class="pill-btn js-back" href="#/"><span class="arrow">←</span><span>Назад</span></a>
          <button class="pill-btn js-settings">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Настройки</span>
          </button>
          <button class="pill-btn js-anchor is-disabled" data-direction="up"><span>К закладке</span><span class="arrow">↑</span></button>
        </div>
      </footer>
    </template>

    <div class="modal" id="settings-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-head">
          <h2 id="settings-title">Настройки</h2>
          <button class="icon-btn" aria-label="Закрыть" data-close>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <section class="settings-section">
            <h3 class="settings-section-title">Размер шрифта</h3>
            <div class="size-picker js-size-picker">
              <button type="button" data-size="0.9">90%</button>
              <button type="button" data-size="1">100%</button>
              <button type="button" data-size="1.1">110%</button>
              <button type="button" data-size="1.2">120%</button>
              <button type="button" data-size="1.3">130%</button>
              <button type="button" data-size="1.4">140%</button>
              <button type="button" data-size="1.5">150%</button>
            </div>
          </section>

          <hr class="modal-divider" />

          <section class="settings-section">
            <h3 class="settings-section-title">Тема</h3>
            <div class="theme-picker js-theme-picker">
              <button type="button" data-theme="system">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
                <span>Авто</span>
              </button>
              <button type="button" data-theme="light">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                <span>Светлая</span>
              </button>
              <button type="button" data-theme="dark">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <span>Тёмная</span>
              </button>
            </div>
          </section>

          <hr class="modal-divider" />

          <section class="settings-section">
            <h3 class="settings-section-title">Авторизация</h3>
            <div class="settings-actions">
              <button class="reset-btn js-auth-reset" type="button">Выйти</button>
              <button class="cache-btn js-cache-reset" type="button">Сбросить кэш</button>
            </div>
          </section>
        </div>
      </div>
    </div>

    <div class="modal" id="confirm-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card modal-confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <div class="modal-body confirm-body">
          <h3 id="confirm-title" class="confirm-title">Сбросить авторизацию?</h3>
          <p class="confirm-text">Будут удалены все данные: авторизация, сохранённые статьи, настройки. Для повторного входа потребуется пароль.</p>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" type="button" data-close>Отмена</button>
          <button class="btn-destructive js-auth-reset-confirm" type="button" disabled>Сбросить (5)</button>
        </div>
      </div>
    </div>

    <div class="modal" id="cache-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card modal-confirm" role="dialog" aria-modal="true" aria-labelledby="cache-title">
        <div class="modal-body confirm-body">
          <h3 id="cache-title" class="confirm-title">Сбросить кэш?</h3>
          <p class="confirm-text">Кэш приложения будет очищен. Приложение перезагрузится и подгрузит данные заново.</p>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" type="button" data-close>Отмена</button>
          <button class="btn-neutral js-cache-reset-confirm" type="button">Сбросить кэш</button>
        </div>
      </div>
    </div>

    <script src="./marked.min.js"></script>
    <script src="./app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
  </body>
</html>
